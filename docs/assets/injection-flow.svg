<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-label="How mem intercepts a Cline prompt">
  <rect width="960" height="640" rx="14" fill="#0d1117" stroke="#30363d"/>
  <text x="480" y="36" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="18" fill="#e6edf3">How mem joins one Cline turn</text>

  <!-- lanes -->
  <g font-family="SFMono-Regular, Consolas, 'PingFang SC', 'Microsoft YaHei', monospace" font-size="13" fill="#c9d1d9">
    <text x="70" y="80" text-anchor="middle" fill="#79c0ff">User</text>
    <text x="270" y="80" text-anchor="middle" fill="#79c0ff">Cline (VS Code)</text>
    <text x="500" y="80" text-anchor="middle" fill="#7ee787">mem hook (process)</text>
    <text x="720" y="80" text-anchor="middle" fill="#ffa657">memd + SQLite</text>
    <text x="900" y="80" text-anchor="middle" fill="#d2a8ff">LLM provider</text>

    <line x1="70" y1="95" x2="70" y2="600" stroke="#30363d" stroke-dasharray="4 4"/>
    <line x1="270" y1="95" x2="270" y2="600" stroke="#30363d" stroke-dasharray="4 4"/>
    <line x1="500" y1="95" x2="500" y2="600" stroke="#30363d" stroke-dasharray="4 4"/>
    <line x1="720" y1="95" x2="720" y2="600" stroke="#30363d" stroke-dasharray="4 4"/>
    <line x1="900" y1="95" x2="900" y2="600" stroke="#30363d" stroke-dasharray="4 4"/>
  </g>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8b949e"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7ee787"/>
    </marker>
  </defs>

  <g font-family="SFMono-Regular, Consolas, 'PingFang SC', 'Microsoft YaHei', monospace" font-size="13" fill="#c9d1d9" stroke="#8b949e" marker-end="url(#arrow)">
    <!-- 1 prompt -->
    <line x1="70" y1="130" x2="262" y2="130"/>
    <text x="80" y="120" stroke="none" fill="#8b949e">1. type prompt</text>

    <!-- 2 hook call -->
    <line x1="270" y1="170" x2="492" y2="170" stroke="#7ee787" marker-end="url(#arrowGreen)"/>
    <text x="280" y="160" stroke="none" fill="#7ee787">2. UserPromptSubmit hook (JSON on stdin)</text>

    <!-- 3 recall -->
    <line x1="500" y1="215" x2="712" y2="215" stroke="#7ee787" marker-end="url(#arrowGreen)"/>
    <text x="510" y="205" stroke="none" fill="#7ee787">3. recall: units / cards / turns (FTS + optional rerank)</text>
    <line x1="720" y1="250" x2="508" y2="250" stroke="#7ee787" marker-end="url(#arrowGreen)"/>
    <text x="530" y="240" stroke="none" fill="#7ee787">4. rows</text>

    <!-- 4 contextModification -->
    <line x1="500" y1="295" x2="278" y2="295" stroke="#7ee787" marker-end="url(#arrowGreen)"/>
    <text x="300" y="285" stroke="none" fill="#7ee787">5. stdout: { contextModification: "&lt;memory&gt;…" }</text>

    <!-- 5 request -->
    <line x1="270" y1="345" x2="892" y2="345" stroke="#d2a8ff" marker-end="url(#arrow)"/>
    <text x="300" y="335" stroke="none" fill="#d2a8ff">6. provider request = system + history + hook_context(memory) + prompt</text>

    <!-- 6 response -->
    <line x1="900" y1="390" x2="278" y2="390" stroke="#d2a8ff" marker-end="url(#arrow)"/>
    <text x="430" y="380" stroke="none" fill="#d2a8ff">7. response (+ tool calls)</text>

    <!-- 7 MCP -->
    <line x1="270" y1="435" x2="492" y2="435" stroke="#79c0ff" marker-end="url(#arrow)"/>
    <text x="280" y="425" stroke="none" fill="#79c0ff">8. model calls MCP tool (mem_recall / mem_remember)</text>
    <line x1="500" y1="470" x2="712" y2="470" stroke="#79c0ff" marker-end="url(#arrow)"/>
    <text x="510" y="460" stroke="none" fill="#79c0ff">9. read / write SQLite</text>

    <!-- 8 capture -->
    <line x1="270" y1="515" x2="492" y2="515"/>
    <text x="280" y="505" stroke="none" fill="#8b949e">10. TaskComplete / PreToolUse / PreCompact hooks fire</text>
    <line x1="500" y1="550" x2="712" y2="550"/>
    <text x="510" y="540" stroke="none" fill="#8b949e">11. raw JSONL spool</text>
    <line x1="720" y1="585" x2="508" y2="585"/>
    <text x="520" y="575" stroke="none" fill="#8b949e">12. daemon ingests + distills later (async)</text>
  </g>

  <text x="480" y="628" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="12" fill="#484f58">steps 1-7 = injection path (synchronous, fail-open) · steps 8-9 = MCP tools · steps 10-12 = capture path (asynchronous)</text>
</svg>
