name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test
        run: node --test "tests/**/*.test.ts"
      - name: Coverage (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: npm run coverage
